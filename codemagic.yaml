workflows:
  android-kivy:
    name: SPD Hub APK Build
    max_build_duration: 60
    scripts:
      - name: Install Python dependencies
        script: |
          pip install setuptools
          pip install --upgrade buildozer cython

      - name: Install macOS build prerequisites
        script: |
          brew install automake openssl@3 pkg-config || true

      - name: Build APK
        script: |
          export ANDROID_SDK_ROOT="/usr/local/share/android-sdk"
          export ANDROID_NDK_HOME="/usr/local/share/android-sdk/ndk/29.0.14206865"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          export LDFLAGS="-L/opt/homebrew/opt/openssl@3/lib"
          export CPPFLAGS="-I/opt/homebrew/opt/openssl@3/include"

          # Patch p4a openssl if already cloned
          P4A_PREREQ="$HOME/clone/.buildozer/android/platform/python-for-android/pythonforandroid/prerequisites.py"
          [ -f "$P4A_PREREQ" ] && sed -i '' 's/openssl@1\.1/openssl@3/g' "$P4A_PREREQ"

          yes | buildozer android debug

    artifacts:
      - bin/*.apk

    publishing:
      email:
        recipients:
          - spdregistration@gmail.com
