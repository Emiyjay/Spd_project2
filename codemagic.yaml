workflows:
  android-kivy:
    name: SPD Hub APK Build
    max_build_duration: 60
    scripts:
      - name: Install Python dependencies
        script: |
          pip install setuptools buildozer cython

      - name: Setup Android SDK manually
        script: |
          export ANDROID_SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"

          # Download latest cmdline-tools
          curl -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-mac-11076708_latest.zip
          unzip -q cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          rm cmdline-tools.zip

          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"

          # Accept all licenses non-interactively
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses || true

          # Install required SDK components
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "build-tools;33.0.2" \
            "platforms;android-31"

          # Create legacy tools/bin/sdkmanager symlink that buildozer expects
          mkdir -p "$ANDROID_SDK_ROOT/tools/bin"
          ln -sf "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
                 "$ANDROID_SDK_ROOT/tools/bin/sdkmanager"

      - name: Build APK
        script: |
          export ANDROID_SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          buildozer android debug

    artifacts:
      - bin/*.apk

    publishing:
      email:
        recipients:
          - spdregistration@gmail.com
