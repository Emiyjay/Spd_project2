workflows:
  android-kivy:
    name: SPD Hub APK Build
    max_build_duration: 60

    scripts:
      - name: Setup Python & install dependencies
        script: |
          pyenv install 3.10.13 || true
          pyenv global 3.10.13

          python --version
          pip install --upgrade pip
          pip install setuptools
          pip install --upgrade buildozer
          pip install "cython<3.0"

      - name: Install macOS build prerequisites
        script: |
          brew install automake openssl@3 pkg-config cmake autoconf libtool

      - name: Accept Android licenses
        script: |
          yes | sdkmanager --licenses || true

      - name: Build APK
        script: |
          export ANDROID_SDK_ROOT="/Users/builder/.buildozer/android/platform/android-sdk"
          export ANDROID_NDK_HOME="/Users/builder/.buildozer/android/platform/android-ndk-r25b"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

          # First pass
          yes | buildozer android debug || true

          # Patch OpenSSL issue
          P4A_PREREQ="/Users/builder/clone/.buildozer/android/platform/python-for-android/pythonforandroid/prerequisites.py"
          if [ -f "$P4A_PREREQ" ]; then
            sed -i '' 's/openssl@1\.1/openssl@3/g' "$P4A_PREREQ"
          fi

          # Second pass
          yes | buildozer android debug

    artifacts:
      - bin/*.apk

    publishing:
      email:
        recipients:
          - emmanueljohn98878@gmail.com
