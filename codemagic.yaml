workflows:
  android-kivy:
    name: SPD Hub APK Build
    max_build_duration: 60
    scripts:
      - name: Install dependencies
        script: |
          pip install buildozer cython

      - name: Create buildozer.spec if missing
        script: |
          if [ ! -f buildozer.spec ]; then
            buildozer init
            sed -i 's/^title = .*/title = SPD Hub/' buildozer.spec
            sed -i 's/^package.name = .*/package.name = spdhub/' buildozer.spec
            sed -i 's/^package.domain = .*/package.domain = org.spdproject/' buildozer.spec
            sed -i 's/^requirements = .*/requirements = python3,kivy/' buildozer.spec
          fi

      - name: Build APK
        script: |
          buildozer android debug

    artifacts:
      - bin/*.apk

    publishing:
      email:
        recipients:
          - spdregistration@gmail.com
