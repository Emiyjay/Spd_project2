workflows:
  android-kivy:
    name: SPD Hub APK Build
    max_build_duration: 60
    scripts:
      - name: Install Python dependencies
        script: |
          pip install setuptools
          pip install --upgrade buildozer python-for-android cython

      - name: Install macOS build prerequisites
        script: |
          brew install automake openssl@3 pkg-config || true

      - name: Setup Android SDK manually
        script: |
          export ANDROID_SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"

          curl -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-mac-11076708_latest.zip
          unzip -q cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          rm cmdline-tools.zip

          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses || true
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "build-tools;33.0.2" \
            "platforms;android-31"

          mkdir -p "$ANDROID_SDK_ROOT/tools/bin"
          ln -sf "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
                 "$ANDROID_SDK_ROOT/tools/bin/sdkmanager"

      - name: Build APK
        script: |
          export ANDROID_SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          export LDFLAGS="-L/opt/homebrew/opt/openssl@3/lib"
          export CPPFLAGS="-I/opt/homebrew/opt/openssl@3/include"

          # First run: let buildozer clone p4a (may fail — ok)
          buildozer android debug || true

          # Patch hardcoded openssl@1.1 -> openssl@3
          P4A_PREREQ="$HOME/clone/.buildozer/android/platform/python-for-android/pythonforandroid/prerequisites.py"
          if [ -f "$P4A_PREREQ" ]; then
            sed -i '' 's/openssl@1\.1/openssl@3/g' "$P4A_PREREQ"
            echo "Patched openssl@1.1 -> openssl@3"
          fi

          # Final build
          buildozer android debug

    artifacts:
      - bin/*.apk

    publishing:
      email:
        recipients:
          - emmanueljohn98878@gmail.com
